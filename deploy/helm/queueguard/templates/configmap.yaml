apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "queueguard.fullname" . }}-config
  labels:
    {{- include "queueguard.labels" . | nindent 4 }}
data:
  ORIGIN_URL: {{ .Values.config.originUrl | quote }}
  DISCHARGE_RATE: {{ .Values.config.dischargeRate | quote }}
  TICKET_TTL: {{ .Values.config.ticketTtl | quote }}
  BYPASS_PATHS: {{ .Values.config.bypassPaths | quote }}
  IP_RATE_LIMIT: {{ .Values.config.ipRateLimit | quote }}
  IP_RATE_BURST: {{ .Values.config.ipRateBurst | quote }}
  BIND_DEVICE: {{ .Values.config.bindDevice | quote }}
  POW_DIFFICULTY: {{ .Values.config.powDifficulty | quote }}
  EVENT_START_TIME: {{ .Values.config.eventStartTime | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  EVENT_TITLE: {{ .Values.config.eventTitle | quote }}
  BRAND_LOGO_URL: {{ .Values.config.brandLogoUrl | quote }}
  THEME_COLOR: {{ .Values.config.themeColor | quote }}
  ANNOUNCEMENT_TEXT: {{ .Values.config.announcementText | quote }}
  ROOMS_CONFIG: {{ .Values.config.roomsConfig | quote }}
