services:
  # The protected upstream service (e.g. your ticketing, e-commerce, or web API)
  mock-origin:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/mock-origin"]
    ports:
      - "8080:8080"
    environment:
      - MOCK_PORT=8080
    restart: unless-stopped

  # QueueGuard Virtual Waiting Room Reverse Proxy
  queueguard:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/queueguard"]
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ORIGIN_URL=http://mock-origin:8080
      - DISCHARGE_RATE=10
      - TICKET_TTL=10m
      - SECRET_KEY=queueguard-demo-secret-key-2026
      - ADMIN_TOKEN=queueguard-admin-secret
      - BYPASS_PATHS=.css,.js,.png,.jpg,.jpeg,.gif,.svg,.ico,/favicon.ico,/robots.txt
      - IP_RATE_LIMIT=120
      - IP_RATE_BURST=30
      - EVENT_START_TIME=
      - REDIS_URL=
    depends_on:
      - mock-origin
    restart: unless-stopped

