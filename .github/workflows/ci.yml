name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify Go Dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Test Suite
        run: go test -v -race ./...

      - name: Cross-Platform Build Test
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 go build -o bin/queueguard-linux-amd64 ./cmd/server
          GOOS=windows GOARCH=amd64 go build -o bin/queueguard-windows-amd64.exe ./cmd/server
          GOOS=darwin GOARCH=arm64 go build -o bin/queueguard-darwin-arm64 ./cmd/server
          ls -la bin/
