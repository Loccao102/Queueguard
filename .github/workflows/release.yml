name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Binaries
        run: |
          mkdir -p dist
          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/queueguard-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/queueguard-linux-arm64 ./cmd/server
          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/queueguard-windows-amd64.exe ./cmd/server
          # macOS
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/queueguard-darwin-amd64 ./cmd/server
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/queueguard-darwin-arm64 ./cmd/server

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
